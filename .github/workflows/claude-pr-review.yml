name: claude-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'PR URL (e.g. https://github.com/owner/repo/pull/123)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ inputs.pr_url || github.event.pull_request.html_url }}';
            const m = url.match(/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
            if (!m) { core.setFailed('Invalid PR URL: ' + url); return; }
            core.setOutput('owner', m[1]);
            core.setOutput('repo', m[2]);
            core.setOutput('number', m[3]);

      - name: Fetch PR diff + metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pr
          gh pr diff "${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}#${{ steps.pr.outputs.number }}" > /tmp/pr/diff.patch
          gh pr view "${{ steps.pr.outputs.owner }}/${{ steps.pr.outputs.repo }}#${{ steps.pr.outputs.number }}" \
            --json title,body,author,baseRefName,headRefName,additions,deletions,changedFiles,files \
            > /tmp/pr/meta.json
          wc -l /tmp/pr/diff.patch
          ls -la /tmp/pr/

      - name: Run Claude Code review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 .github/scripts/claude_pr_review.py \
            --diff /tmp/pr/diff.patch \
            --meta /tmp/pr/meta.json \
            --output /tmp/pr/review.md
          cat /tmp/pr/review.md

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/pr/review.md', 'utf-8');
            const body = `## 🤖 Claude Code Review\n\n${review}\n\n<sub>Posted by \`claude-builders-bounty/claude-pr-review\` v1 · [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
